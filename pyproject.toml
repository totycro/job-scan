[project]
name = "job-scan"
version = "0.1.0"
description = "Evidence-backed work-arrangement assessments from saved job HTML"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "pydantic==2.14.3",
    "typer==0.28.0",
]

[project.scripts]
job-scan = "job_scan.cli:entrypoint"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.99",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ANN", "S", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-generic-narrowing = true
strict-equality-semantics = true

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "--strict-markers --disable-socket"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["job_scan"]

[tool.coverage.report]
fail_under = 90
show_missing = true
