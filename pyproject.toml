[project]
name = "job-scan"
version = "0.1.0"
description = "Evidence-backed work-arrangement assessments from saved job HTML"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx", "pyjwt[crypto]", "pydantic>=2,<3"]

[project.scripts]
job-scan = "job_scan.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pytest-cov", "pytest-socket"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ANN", "S", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-generic-narrowing = true
strict-equality-semantics = true

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "--strict-markers --disable-socket"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["job_scan"]

[tool.coverage.report]
fail_under = 90
show_missing = true
